[package]
name = "axel-rex"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rex terminal client for Axel: floating layers, windows, labels, OSC 7501 status"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
# OSC 7577's report signature (resume.rs).
sha2.workspace = true
# The control connection (control.rs): WebSocket framing over a Unix socket, no async runtime.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
