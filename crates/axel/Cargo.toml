[package]
name = "axel"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "axel"
path = "src/main.rs"

[dependencies]
crossterm.workspace = true
axel-identity.workspace = true
axel-inbox.workspace = true
axel-config.workspace = true
axel-store.workspace = true
axel-rex.workspace = true
axel-tui.workspace = true
axel-acp.workspace = true
axel-mcp.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
base64.workspace = true
libc.workspace = true
dialoguer = "0.12.0"
console = "0.16.6"
unicode-width = "0.2"
# The syntaxes come from the dump build.rs compiles, not syntect's own bundle.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }

[build-dependencies]
# Only to compile `syntaxes/` into the dump the binary embeds (see build.rs).
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "yaml-load", "dump-create", "regex-fancy"] }

[dev-dependencies]
tempfile.workspace = true
