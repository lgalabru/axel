<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axel</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-view="{{view}}">

<section id="messages" class="view messages">
  <header class="bar">
    <h1 id="title">Loading…</h1>
    <span id="live" class="live"></span>
  </header>
  <main id="timeline" class="timeline" aria-live="polite"></main>
  <button id="jump" class="jump" hidden>↓ latest</button>
</section>

<section id="composer" class="view composer">
  <div class="field">
    <div class="meta">
      <span id="target" class="target"></span>
      <span id="mode" class="mode"></span>
      <span id="status" class="status"></span>
    </div>
    <div id="suggest" class="suggest" hidden></div>
    <div class="line">
      <span class="prompt">&gt;</span>
      <textarea id="input" placeholder="write to the thread · @name to ask an agent" spellcheck="false"></textarea>
    </div>
    <div class="controls">
      <span class="keys">⏎ send · ⇧⏎ new line · ^⏎ interrupt · esc stop</span>
      <button type="button" id="stop" class="ghost" hidden>stop</button>
      <button type="button" id="send" class="primary">send</button>
    </div>
  </div>
</section>

<section id="activity" class="view activity">
  <div id="activity-body"></div>
</section>

<script src="/app.js"></script>
</body>
</html>
