name: CI

# Pull requests run this directly; the release workflow calls it before every build.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Clippy and tests
    # Intel: GitHub's arm64 macOS runners are often out of capacity.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
