name: Release

# Every commit on main that passes CI ships: a GitHub release `v<version>` with
# macOS binaries, and the formula in scarce/homebrew-axel moved to it, so
# `brew upgrade` always lands on the newest main.
#
# The version is the workspace's major.minor plus the commit count on main
# (0.3.142), so it only ever grows.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Releases go out one at a time, in push order, so an older build never
# overwrites the formula after a newer one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          base=$(sed -n -E '/^\[workspace\.package\]/,/^\[/ s/^version = "([0-9]+\.[0-9]+)\..*"/\1/p' Cargo.toml)
          echo "version=$base.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  # One Intel runner builds both binaries (Apple silicon cross-compiled):
  # GitHub's arm64 macOS runners are often out of capacity, and one job
  # means one runner to wait for, not two.
  build:
    name: Build
    needs: [ci, version]
    runs-on: macos-15-intel
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Stamp the version
        run: sed -i '' -E "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release -p axel --bin axel --target "$target"
          done
      - name: Package
        run: |
          # The Intel binary runs here; the Apple silicon one is checked for its architecture.
          target/x86_64-apple-darwin/release/axel --version | grep -q "$VERSION"
          lipo -archs target/aarch64-apple-darwin/release/axel | grep -qx arm64
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            name=axel-$VERSION-$target.tar.gz
            tar -C "target/$target/release" -czf "$name" axel
            shasum -a 256 "$name" > "$name.sha256"
          done
      # Signed build provenance: `gh attestation verify <tarball> --repo scarce/axel`.
      # The install script checks it when gh is logged in.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: axel-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: axel-macos
          path: axel-*.tar.gz*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          {
            git log -1 --format='%B' "$GITHUB_SHA"
            echo
            echo '```'
            echo 'brew install scarce/axel/axel   # or: brew upgrade axel'
            echo '```'
          } > notes.md
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "axel $VERSION" --notes-file notes.md --latest

  tap:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: axel
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v5
        with:
          repository: scarce/homebrew-axel
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Move the formula to this release
        run: |
          sha() { cut -d' ' -f1 "dist/axel-$VERSION-$1.tar.gz.sha256"; }
          mkdir -p tap/Formula
          axel/.github/scripts/formula.sh "$VERSION" "$GITHUB_REPOSITORY" \
            "$(sha aarch64-apple-darwin)" "$(sha x86_64-apple-darwin)" > tap/Formula/axel.rb
          cd tap
          git config user.name "axel release"
          git config user.email "release@axel.md"
          git add Formula/axel.rb
          git commit -m "axel $VERSION"
          git push
